# Validate source and synthetic regressions; this workflow does not deploy to tenants.
name: Python validation
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install ruff
      - run: ruff check .
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r requirements.txt 'coverage[toml]'  # toml extra: pyproject config on Python < 3.11
      - run: python -m py_compile netskope_mist_connector.py
      # Threshold and source are defined in pyproject.toml ([tool.coverage]).
      - run: python -m coverage run -m unittest discover -s tests -v
      - run: python -m coverage report
      - run: python netskope_mist_connector.py --help
      - run: python netskope_mist_connector.py --lifecycle-config examples/lifecycle.example.json --profile-digest
